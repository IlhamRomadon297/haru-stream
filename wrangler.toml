name = "haru-stream"
main = "src/index.js"
account_id = "11b88ee6fb0a7509cabc91b5b5cd64de"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ============================================================
# Cron Triggers — Smart Auto-Sync Scheduler
# Fires every 1 minute; actual sync interval is configurable
# in the dashboard (default 30 min). When it fires but it is
# not yet time to sync, it returns immediately (1 D1 read only).
# ============================================================
[triggers]
crons = ["*/1 * * * *"]

# ============================================================
# D1 Database Binding
# ============================================================
[[d1_databases]]
binding     = "DB"
database_name = "haru-stream-db"
database_id = "394035de-7e3c-42cc-b312-9b508a86c8c8"

# ============================================================
# Environment Variables (Non-secret)
# ============================================================
[vars]
# Production Environment Variables
APP_NAME       = "HaruStream"
APP_VERSION    = "1.0.0"
JWT_EXPIRES_IN = "7d"
CORS_ORIGIN    = "*"
# Cron: auto-sync runs every 1 minute
AUTO_SYNC_INTERVAL_MINUTES = "1"

# Development / Preview environment
[env.development]
vars = { APP_NAME = "HaruStream", APP_VERSION = "1.0.0-dev", JWT_EXPIRES_IN = "7d", CORS_ORIGIN = "*", AUTO_SYNC_INTERVAL_MINUTES = "1" }

# ============================================================
# Secrets — set via: wrangler secret put <KEY>
# JWT_SECRET   : Random 256-bit hex string for signing JWTs
# ============================================================

# ============================================================
# Production environment overrides
# ============================================================
[env.production]
name = "haru-stream"

[[env.production.d1_databases]]
binding       = "DB"
database_name = "haru-stream-db"
database_id   = "394035de-7e3c-42cc-b312-9b508a86c8c8"

[env.production.vars]
APP_NAME    = "HaruStream"
CORS_ORIGIN = "https://haru-stream.pages.dev"
